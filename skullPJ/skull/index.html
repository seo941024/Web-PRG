<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>해골용사 — 탑다운</title>
<style>
  @font-face {
    font-family: "SkullFont";
    src: url("skull_base_font.ttf") format("truetype");
    font-weight: normal;
    font-display: block;
  }
</style>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="1280" height="720"></canvas>
    <div id="hint">
      <span class="hkey">방향키/WASD</span><span class="hlbl">이동</span>
      <span class="hkey">Z</span><span class="hlbl">스프린트</span>
      <span class="hkey">Space</span><span class="hlbl">회피</span>
      <span class="hkey">C</span><span class="hlbl">공격</span>
    </div>
  </div>

  <!-- 상태/유틸 -->
  <script src="js/core.js"></script>
  <script src="js/input.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/sprites.js"></script>
  <!-- 전투(오브젝트 풀·데미지 코어) -->
  <script src="js/combat.js"></script>
  <!-- 스태미나 상수만 재사용(Game.player 종속 함수들은 아직 미사용) -->
  <script src="js/systems.js"></script>
  <!-- 플레이어/적/렌더/루프 -->
  <script src="js/player.js"></script>
  <script src="js/boss.js"></script>
  <script src="js/mob.js"></script>
  <script src="js/render_entities.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
