<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>해골용사 — 탑다운</title>
<style>
  @font-face {
    font-family: "SkullFont";
    src: url("skull_base_font.ttf") format("truetype");
    font-weight: normal;
    font-display: block;
  }
</style>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="1280" height="720"></canvas>
    <div id="hint">
      <span class="hkey">방향키/WASD</span><span class="hlbl">이동</span>
      <span class="hkey">Z</span><span class="hlbl">스프린트</span>
      <span class="hkey">Space</span><span class="hlbl">회피</span>
      <span class="hkey">C</span><span class="hlbl">공격</span>
      <span class="hkey">Shift</span><span class="hlbl">스킬</span>
      <span class="hkey">ESC</span><span class="hlbl">일시정지</span>
      <span class="hkey">M</span><span class="hlbl">음소거</span>
    </div>
  </div>

  <!-- 상태/유틸 -->
  <script src="js/core.js"></script>
  <script src="js/input.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/audio.js"></script>
  <!-- 데이터 레이어 — main.js가 로드 직후 방을 만들므로 반드시 그보다 먼저 -->
  <script src="js/stage.js"></script>
  <script src="js/equip.js"></script>
  <script src="js/relic.js"></script>
  <script src="js/shop.js"></script>
  <!-- 전투(오브젝트 풀·데미지 코어·드롭·장판) -->
  <script src="js/combat.js"></script>
  <!-- 플레이어/적 -->
  <script src="js/player.js"></script>
  <script src="js/skill.js"></script>
  <script src="js/boss.js"></script>
  <script src="js/mob.js"></script>
  <!-- 렌더/화면/컷신 -->
  <script src="js/render_entities.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cutscene.js"></script>
  <!-- 루프 (마지막) -->
  <script src="js/main.js"></script>
</body>
</html>
