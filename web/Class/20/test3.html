<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>도서 관리 프로그램</title>
  </head>
  <body>
    <button id="saveBtn">도서 데이터 저장</button>
    <button id="loadBtn">도서 데이터 불러오기</button>
    <button id="findBtn">id가 3인 도서 찾기</button>
    <button id="filterBtn">15,000원 이상 도서 필터링</button>
    <button id="mapBtn">도서 제목만 배열로 만들기</button>

    <pre id="result"></pre>

    <script>
      // 도서 데이터 (JSON 객체 배열)
      const books = [
        { id: 1, title: "자바스크립트 완벽 가이드", price: 35000 },
        { id: 2, title: "모던 리액트", price: 28000 },
        { id: 3, title: "HTML/CSS 기초", price: 12000 },
        { id: 4, title: "코딩 테스트 합격자 되기", price: 25000 },
        { id: 5, title: "알기 쉬운 알고리즘", price: 14000 },
      ];

      // 제어할 HTML 요소 선택
      const saveBtn = document.querySelector("#saveBtn");
      const loadBtn = document.querySelector("#loadBtn");
      const findBtn = document.querySelector("#findBtn");
      const filterBtn = document.querySelector("#filterBtn");
      const mapBtn = document.querySelector("#mapBtn");
      const result = document.querySelector("#result");

      // 1. 데이터 저장: 객체 배열을 문자열로 변환(stringify)하여 localStorage에 저장
      saveBtn.addEventListener("click", function () {
        localStorage.setItem("books", JSON.stringify(books));
        result.textContent =
          "도서 데이터가 localStorage에 성공적으로 저장되었습니다.";
      });

      // 2. 데이터 불러오기: 저장된 문자열을 다시 객체 배열로 변환(parse)
      loadBtn.addEventListener("click", function () {
        const savedData = localStorage.getItem("books");
        const booksList = JSON.parse(savedData);
        result.textContent = JSON.stringify(booksList, null, 2);
      });

      // 3. find: 배열에서 조건(id === 3)에 맞는 딱 1개의 데이터 찾기
      findBtn.addEventListener("click", function () {
        const savedData = localStorage.getItem("books");
        const booksList = JSON.parse(savedData);
        const targetBook = booksList.find((book) => book.id === 3);
        result.textContent = JSON.stringify(targetBook, null, 2);
      });

      // 4. filter: 배열에서 조건(price >= 15000)을 만족하는 데이터만 걸러내기
      filterBtn.addEventListener("click", function () {
        const savedData = localStorage.getItem("books");
        const booksList = JSON.parse(savedData);
        const expensiveBooks = booksList.filter((book) => book.price >= 15000);
        result.textContent = JSON.stringify(expensiveBooks, null, 2);
      });

      // 5. map: 배열의 각 데이터에서 제목(title)만 뽑아내어 새로운 배열 만들기
      mapBtn.addEventListener("click", function () {
        const savedData = localStorage.getItem("books");
        const booksList = JSON.parse(savedData);
        const titles = booksList.map((book) => book.title);
        result.textContent = JSON.stringify(titles, null, 2);
      });
    </script>
  </body>
</html>
