<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>SKULL YUUSHA</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/neodgm/neodgm-webfont@1.530/neodgm/style.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="wrapper">
      <!-- 💡 상단 바 (틀이 무너지지 않도록 최소 높이 고정) -->
      <div id="topBar" style="min-height: 46px">
        <!-- 게임 전에는 내부 요소들을 숨김 처리 (display: none) -->
        <div id="ui-hp" class="hpArea" style="display: none; width: 250px">
          <span class="hpLabel">HP</span>
          <div
            id="playerHpBarWrap"
            style="
              width: 150px;
              height: 16px;
              background: #200505;
              border: 2px solid #ffaaaa;
              position: relative;
            "
          >
            <div
              id="playerHpFill"
              style="
                width: 100%;
                height: 100%;
                background: #ff1111;
                transition: width 0.1s;
              "
            ></div>
            <div
              id="playerShieldFill"
              style="
                width: 0%;
                height: 100%;
                background: #00ccff;
                position: absolute;
                top: 0;
                left: 0;
                transition: width 0.1s;
                opacity: 0.8;
                display: none;
              "
            ></div>
            <span
              id="hpText"
              style="
                position: absolute;
                width: 100%;
                text-align: center;
                left: 0;
                top: -2px;
                font-size: 14px;
                font-weight: bold;
                color: #fff;
                text-shadow: 1px 1px 2px #000;
              "
              >50 / 50</span
            >
          </div>
        </div>
        <div id="stageLabel" style="display: none; flex: 1; text-align: center">
          STAGE 1-1
        </div>
        <div
          id="scoreLabel"
          style="display: none; width: 250px; text-align: right"
        >
          SCORE: 0
        </div>
      </div>

      <div
        id="reviveLabel"
        style="
          color: #ff0088;
          font-weight: bold;
          font-size: 14px;
          text-align: center;
          display: none;
          margin-bottom: 5px;
          text-shadow: 1px 1px 2px #000;
        "
      >
        [불사조의 깃털 n개 보유중]
      </div>

      <div id="bossBarWrap">
        <div id="bossBarLabel">BOSS</div>
        <div id="bossTrack"><div id="bossFill" style="width: 100%"></div></div>
      </div>

      <!-- 메인 캔버스 영역 -->
      <div id="canvasWrap">
        <canvas id="c" width="640" height="360"></canvas>

        <!-- 💡 두 번째 이미지와 100% 동일한 디자인의 오버레이 -->
        <div
          id="overlay"
          style="
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1a0b2e 0%, #05020a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
          "
        >
          <h1
            style="
              color: #ff0055;
              font-size: 64px;
              margin: 0 0 20px 0;
              text-shadow: 4px 4px 0 #550000;
              letter-spacing: 2px;
            "
          >
            SKULL YUUSHA
          </h1>
          <p
            class="sub"
            style="
              color: #ccc;
              font-size: 18px;
              margin: 5px 0;
              text-align: center;
              line-height: 1.5;
            "
          >
            저주에 의해 죽었지만 해골로 되살아난 용사. <br />마왕을 물리치고
            저주를 풀기 위해 나아가야 한다.
          </p>
          <p
            class="sub"
            style="
              color: #ffaa00;
              font-size: 18px;
              font-weight: bold;
              margin: 25px 0 10px 0;
              text-align: center;
              line-height: 1.5;
            "
          >
            [안내] 패링, 기본 공격 시 스킬 게이지가 충전됩니다.<br />
            게이지를 모아 강력한 기술을 사용하세요.
          </p>
          <p
            class="sub"
            style="color: #00cc88; font-size: 14px; margin-bottom: 30px"
          >
            준비가 끝났다면 아래 버튼 또는 SPACE를 눌러주세요.
          </p>
          <button
            class="startBtn"
            id="startBtn"
            style="
              background: #ff0055;
              color: #fff;
              font-family: &quot;NeoDunggeunmo&quot;, sans-serif;
              font-size: 24px;
              padding: 15px 30px;
              border: 3px solid #fff;
              cursor: pointer;
              box-shadow: 4px 4px 0 #550000;
              display: flex;
              align-items: center;
              gap: 10px;
            "
          >
            ▶ READY TO ADVENTURE
          </button>
        </div>
      </div>

      <!-- 💡 하단 바 (틀이 무너지지 않도록 최소 높이 고정) -->
      <div id="bottomBar" style="min-height: 42px">
        <span id="killLabel" style="display: none; width: 250px">처치: 0</span>
        <div style="flex: 1"></div>
        <!-- 중앙 빈 공간 확보 -->
        <div
          id="ui-skill"
          style="
            display: none;
            align-items: center;
            gap: 10px;
            width: 250px;
            justify-content: flex-end;
          "
        >
          <span style="color: #ffee00; font-weight: bold">SKILL</span>
          <div
            style="
              width: 100px;
              height: 12px;
              background: #111;
              border: 1px solid #ffee00;
              position: relative;
            "
          >
            <div
              id="mpFill"
              style="
                width: 0%;
                height: 100%;
                background: #ffee00;
                transition: width 0.1s;
              "
            ></div>
          </div>
          <span
            id="skillLabel"
            style="
              color: #ffee00;
              font-size: 12px;
              width: 35px;
              text-align: right;
            "
            >0%</span
          >
        </div>
      </div>

      <!-- 조작법은 항상 노출되도록 설정 -->
      <div id="keyGuideBar" style="display: block">
        [조작] ← → 이동 | Z 대쉬 | X 점프 | C 평타 | ↓ + C 강하 공격 | Shift
        필살기 | V 가드/패링
      </div>
    </div>

    <script src="js/core.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/story.js"></script>
    <script src="js/systems.js"></script>
    <script src="js/mapgen.js"></script>
    <script src="js/mob.js"></script>
    <script src="js/boss.js"></script>
    <script src="js/combat.js"></script>
    <script src="js/stage.js"></script>
    <script src="js/render_stage.js"></script>
    <script src="js/render_ui.js"></script>
    <script src="js/render.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
